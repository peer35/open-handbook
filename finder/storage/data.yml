filter:
  - vol:
    - title: "Data Volume"
    - options:
      - s: "< 1TB"
      - l: "> 1TB"
    - type: single
    - description: "/finder/storage/filter/volume.qmd"
  - class:
    - title: "Data Classification"
    - options:
      - l: "Low"
      - m: "Middle"
      - h: "High"
      - vh: "Very High"
    - type: single
    - description: "/finder/storage/filter/classification.qmd"
  - share:
    - title: "Data Sharing"
    - options:
      - n: "Not needed"
      - vu: "With VU colleagues"
      - all: "With anyone"
    - type: single
    - description: "/finder/storage/filter/sharing.qmd"
  - feat:
    - title: "Features"
    - options:
        - b: "Basic storage"
        - hpc: "ADA HPC connected"
        - col: "Collaboration tools"
        - acl: "Fine-grained access rights"
    - type: multi
    - description: "/finder/storage/filter/features.qmd"
tiles:
  - 1:
    - contents: "/finder/storage/yoda.qmd"
    - filter:
      - vol: ["s","l"]
      - class: ["l","m","h"]
      - share: ["n","vu","all"]
      - feat: ["b"]
  - 2:
    - contents: "/finder/storage/researchdrive.qmd"
    - filter:
      - vol: ["s","l"]
      - class: ["l","m","h"]
      - share: ["n","vu","all"]
      - feat: ["b","col","acl"]
  - 3:
    - contents: "/finder/storage/scistor.qmd"
    - filter:
      - vol: ["s","l"]
      - class: ["l","m","h"]
      - share: ["n","vu"]
      - feat: ["b","hpc","acl"]
  - 4:
    - contents: "/finder/storage/onedrive.qmd"
    - filter:
      - vol: ["s"]
      - class: ["l","m"]
      - share: ["n","vu","all"]
      - feat: ["b","col"]
  - 5:
    - contents: "/finder/storage/teams.qmd"
    - filter:
      - vol: ["s"]
      - class: ["l","m"]
      - share: ["n","vu","all"]
      - feat: ["b","col"]
  - 6:
    - contents: "/finder/storage/portable.qmd"
    - filter:
      - vol: ["s","l"]
      - class: ["l","m","h"]
      - share: ["n"]
      - feat: ["b"]
  - 7:
    - contents: "/finder/storage/custom.qmd"
    - filter:
      - vol: ["s","l"]
      - class: ["l","m","h","vh"]
      - share: ["n","vu","all"]
      - feat: ["b","hpc","col","acl"]