name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Post initial PR comment
        id: comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-preview-comment -->';
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const body = `${marker}\n### Preview\n\n⏳ Building… [view run](${runUrl})`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.setOutput('id', existing.id);
            } else {
              const { data } = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              core.setOutput('id', data.id);
            }

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Fix timestamps
        run: bash .github/scripts/fix-timestamps

      - name: Render site
        id: render
        run: |
          set -o pipefail
          quarto render \
            --metadata "website.site-url:${{ vars.PREVIEW_BASE_URL }}/pr-${{ github.event.number }}/" \
            2>&1 | tee /tmp/build.log

      - name: Deploy via webhook
        id: deploy
        run: |
          set -o pipefail
          tar czf /tmp/pr-preview.tar.gz -C _site .
          curl -fS \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.PREVIEW_DEPLOY_SECRET }}" \
            -H "Content-Type: application/gzip" \
            --data-binary @/tmp/pr-preview.tar.gz \
            -w "\n\nUploaded %{size_upload} bytes in %{time_total}s — HTTP %{http_code}" \
            "${{ vars.PREVIEW_WEBHOOK_URL }}/pr-${{ github.event.number }}" \
            2>&1 | tee /tmp/deploy.log

      - name: Update PR comment with result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- pr-preview-comment -->';
            const url = `${{ vars.PREVIEW_BASE_URL }}/pr-${{ github.event.number }}/`;
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;

            const renderOutcome = '${{ steps.render.outcome }}';
            const deployOutcome  = '${{ steps.deploy.outcome }}';

            function readLog(path) {
              try {
                const lines = fs.readFileSync(path, 'utf8').trimEnd().split('\n');
                if (lines.length > 100) {
                  return `…(truncated — showing last 100 of ${lines.length} lines)\n` + lines.slice(-100).join('\n');
                }
                return lines.join('\n');
              } catch {
                return '(no output captured)';
              }
            }

            let headline;
            if (deployOutcome === 'success') {
              headline = `✅ Deployed to [${url}](${url})`;
            } else if (renderOutcome === 'failure') {
              headline = `❌ Build failed — [view run](${runUrl})`;
            } else if (deployOutcome === 'failure') {
              headline = `❌ Deploy failed — [view run](${runUrl})`;
            } else {
              headline = `❌ Workflow failed — [view run](${runUrl})`;
            }

            const body = [
              marker,
              '### Preview',
              '',
              headline,
              '',
              '<details>',
              '<summary>Build log</summary>',
              '',
              '```',
              readLog('/tmp/build.log'),
              '```',
              '',
              '</details>',
              '',
              '<details>',
              '<summary>Deploy log</summary>',
              '',
              '```',
              readLog('/tmp/deploy.log'),
              '```',
              '',
              '</details>',
            ].join('\n');

            const commentId = Number('${{ steps.comment.outputs.id }}') || 0;
            if (commentId) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: commentId,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
